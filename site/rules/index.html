<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<title>Keeping Up with the Joneses — Rule Book</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4e6c4;background:#091426}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;min-width:0}
button,a{font:600 15px/1.2 system-ui,sans-serif;color:#f4e6c4;border:1px solid #aa8952;background:#20334d;border-radius:9px;min-width:45px;min-height:45px;padding:10px 13px;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid #fae19a;outline-offset:2px}
.top,.foot{display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#101f33;flex:0 0 auto}
.top{border-bottom:1px solid #a98954}
.foot{border-top:1px solid #a98954;padding-bottom:max(8px,env(safe-area-inset-bottom));justify-content:center}
.top strong{font:700 clamp(14px,3.1vw,21px)/1.25 Georgia,serif;flex:1;min-width:0}
.top button{background:#6e4a25;color:#fff0ce}
#return{display:inline-flex;align-items:center}
#frame{position:relative;display:block;flex:1 1 0;min-height:0;min-width:0;overflow:hidden;touch-action:none;user-select:none;background:#06101f;isolation:isolate;cursor:zoom-in}
#page{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;transform:translate3d(0,0,0) scale(1);transform-origin:center center;pointer-events:none;-webkit-user-drag:none}
#page.zoomed{cursor:move}
#loading{position:absolute;inset:auto 8px 14px;pointer-events:none;text-align:center;font-size:13px;text-shadow:0 1px 3px #000}
#loading:empty{display:none}
#counter{white-space:nowrap;min-width:78px;text-align:center;color:#f6d68b;font-weight:700;font-size:14px}
#zoomIn,#zoomDown{font-size:17px}#fitPage{white-space:nowrap;background:#674621;color:#fff1ca}
#hint{font-size:12px;color:#c8c6c2;text-align:center;white-space:nowrap}
body.embedded .top{display:none}
@media(max-width:560px){.top{gap:7px}.top strong{font-size:13px}.top button{padding:9px}button,a{font-size:14px;padding:8px 11px}.foot{gap:5px;flex-wrap:wrap}#hint{display:none}#counter{min-width:61px}}
@media(prefers-reduced-motion:no-preference){#page{transition:transform .12s ease-out}#frame.dragging #page{transition:none}}
</style>
</head>
<body>
<div class="top"><strong>🏘️ KEEPING UP WITH THE JONESES · RULE BOOK</strong><a id="return" href="../">Play game ↗</a><a id="dl" href="../rulebook.pdf" download>⬇ PDF</a><button id="close" type="button" aria-label="Close the rule book">✕ Close</button></div>
<main id="frame" role="region" tabindex="0" aria-label="Rule book page; swipe to change pages, tap to zoom, drag or pinch when zoomed"><img id="page" src="./page-1.webp" alt="Keeping Up with the Joneses rule book, page 1 of 15" decoding="async" fetchpriority="high" draggable="false"><div id="loading" role="status" aria-live="polite"></div></main>
<div class="foot"><button id="prev" type="button" aria-label="Previous rule book page">‹ Prev</button><output id="counter" aria-live="polite">1 / 15</output><button id="next" type="button" aria-label="Next rule book page">Next ›</button><button id="zoomDown" type="button" aria-label="Zoom out" title="Zoom out">−</button><button id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">＋</button><button id="fitPage" type="button" aria-label="Fit entire rulebook page to screen">Fit Page</button><span id="hint">Tap to zoom · Swipe pages · Pinch to enlarge</span></div>
<script>
(()=>{
'use strict';
const embedded=new URLSearchParams(location.search).get('embedded')==='1';
if(embedded)document.body.classList.add('embedded');
const frame=document.getElementById('frame'),pic=document.getElementById('page'),status=document.getElementById('loading');
const prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),zoomInButton=document.getElementById('zoomIn'),zoomDownButton=document.getElementById('zoomDown'),fitButton=document.getElementById('fitPage');
const pointers=new Map();
const MAX_ZOOM=4;
let current=1,zoom=1,panX=0,panY=0,begin=null,lastPinch=0,wasPinching=false,tapTimer=null;
function bounds(){
 const ratio=pic.naturalWidth&&pic.naturalHeight?pic.naturalWidth/pic.naturalHeight:1445/1870,w=frame.clientWidth,h=frame.clientHeight,fitW=Math.min(w,h*ratio),fitH=fitW/ratio;
 return {x:Math.max(0,(fitW*zoom-w)/2),y:Math.max(0,(fitH*zoom-h)/2)};
}
function paint(){
 const b=bounds();panX=Math.max(-b.x,Math.min(b.x,panX));panY=Math.max(-b.y,Math.min(b.y,panY));
 pic.style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+zoom+')';
 zoomInButton.disabled=zoom>=MAX_ZOOM;zoomDownButton.disabled=zoom<=1;fitButton.disabled=zoom===1;
 frame.style.cursor=zoom>1?'grab':'zoom-in';
}
function setZoom(value,x=frame.clientWidth/2,y=frame.clientHeight/2){
 value=Math.max(1,Math.min(MAX_ZOOM,value));
 const factor=value/zoom,cx=frame.clientWidth/2,cy=frame.clientHeight/2;
 panX=panX*factor+(x-cx)*(1-factor);
 panY=panY*factor+(y-cy)*(1-factor);
 zoom=value;if(zoom===1)panX=panY=0;paint();
}
function reset(){zoom=1;panX=panY=0;paint()}
function showPage(page){
 if(page<1||page>15||page===current)return;
 current=page;reset();pointers.clear();begin=null;lastPinch=0;wasPinching=false;
 prev.disabled=current===1;next.disabled=current===15;counter.textContent=current+' / 15';
 status.textContent='Loading page '+current+'…';
 pic.alt="Keeping Up with the Joneses rule book, page "+current+" of 15";
 // Change one image only, rather than downloading all seven pages at once.
 pic.src='./page-'+current+'.webp';
}
pic.addEventListener('load',()=>{status.textContent='';paint()});
pic.addEventListener('error',()=>{status.textContent='Page could not load. Check that page-'+current+'.webp was installed.'});
prev.disabled=true;
prev.addEventListener('click',()=>showPage(current-1));
next.addEventListener('click',()=>showPage(current+1));
zoomInButton.addEventListener('click',()=>setZoom(zoom+.5));
zoomDownButton.addEventListener('click',()=>setZoom(zoom-.5));
fitButton.addEventListener('click',reset);
function close(){
 if(embedded){parent.postMessage({type:'BZ_RULE_BOOK_CLOSE'},location.origin)}
 else {if(history.length>1&&document.referrer)history.back();else window.close();setTimeout(()=>location.assign('../'),250)};
}
document.getElementById('close').addEventListener('click',close);
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){event.preventDefault();close()}
 else if(event.key==='ArrowLeft'){event.preventDefault();showPage(current-1)}
 else if(event.key==='ArrowRight'){event.preventDefault();showPage(current+1)}
 else if((event.key==='+'||event.key==='=')&&event.target===frame){event.preventDefault();setZoom(zoom+.5)}
 else if(event.key==='-'&&event.target===frame){event.preventDefault();setZoom(zoom-.5)}
});
frame.addEventListener('pointerdown',event=>{
 if(event.button!==0&&event.pointerType==='mouse')return;
 frame.setPointerCapture(event.pointerId);
 pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
 if(pointers.size===1){begin={x:event.clientX,y:event.clientY,time:performance.now(),moved:false};wasPinching=false}
 else if(pointers.size===2){wasPinching=true;begin=null;const [a,b]=[...pointers.values()];lastPinch=Math.hypot(a.x-b.x,a.y-b.y)}
 frame.classList.add('dragging');
});
frame.addEventListener('pointermove',event=>{
 if(!pointers.has(event.pointerId))return;
 const before=pointers.get(event.pointerId);
 pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
 if(pointers.size===2){
  const [a,b]=[...pointers.values()],dist=Math.hypot(a.x-b.x,a.y-b.y);
  if(lastPinch>0&&dist>0){const r=frame.getBoundingClientRect();setZoom(zoom*dist/lastPinch,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}
  lastPinch=dist;return;
 }
 if(begin&&(Math.abs(event.clientX-begin.x)>9||Math.abs(event.clientY-begin.y)>9))begin.moved=true;
 if(zoom>1){panX+=event.clientX-before.x;panY+=event.clientY-before.y;paint()}
});
function finish(event){
 if(!pointers.has(event.pointerId))return;
 pointers.delete(event.pointerId);
 if(pointers.size===0)frame.classList.remove('dragging');
 if(wasPinching||pointers.size>0){begin=null;if(!pointers.size)wasPinching=false;return}
 if(!begin)return;
 const dx=event.clientX-begin.x,dy=event.clientY-begin.y,elapsed=performance.now()-begin.time;
 if(zoom===1&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3){showPage(current+(dx<0?1:-1));begin=null;return}
 if(!begin.moved&&elapsed<400){
  const r=frame.getBoundingClientRect(),x=event.clientX-r.left,y=event.clientY-r.top;
  if(zoom>1){setZoom(1)}else{setZoom(2.5,x,y)}
 }
 begin=null;
}
frame.addEventListener('pointerup',finish);
frame.addEventListener('pointercancel',event=>{pointers.delete(event.pointerId);begin=null;wasPinching=false;frame.classList.remove('dragging')});
frame.addEventListener('dblclick',event=>event.preventDefault());
frame.addEventListener('wheel',event=>{
 if(event.ctrlKey||event.metaKey){
  event.preventDefault();const r=frame.getBoundingClientRect();
  setZoom(zoom*(event.deltaY>0?.88:1.12),event.clientX-r.left,event.clientY-r.top);
 }else if(zoom>1){
  event.preventDefault();panX-=event.deltaX;panY-=event.deltaY;paint();
 }
},{passive:false});
new ResizeObserver(()=>paint()).observe(frame);
paint();
})();
</script>
</body>
</html>
