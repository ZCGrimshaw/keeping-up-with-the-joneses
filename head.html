<title>Keeping Up with the Joneses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Lexend:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: a full-bleed cartoon town board with a docked "life sheet" sidebar; panels are chunky ink-outlined cards with hard drop shadows.
   Deliberately single-theme: a bright Saturday-morning palette that reads the same on any host. */
:root{
  --ink:#2a1f3d; --ink-2:#4a3f63; --muted:#6a6383;
  --sky:#bfe7fb; --sky-deep:#9fd8f6; --paper:#fffdf8; --card:#ffffff; --line:#e3dcef; --wash:#f4f0fb;
  --sun:#ffc93c; --coral:#ff6f59; --teal:#18a99c; --plum:#7b4fd1; --grass:#8fd46a;
  --good:#23894a; --good-bg:#dcf5e3; --bad:#c7392f; --bad-bg:#ffe1dc; --time-bg:#dff1ff; --cost-bg:#fff1c4;
  --lcd-bg:#1f2d24; --lcd-fg:#a6ff8f;
  --f-display:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-lcd:'VT323',ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:hidden;
  background-image:radial-gradient(circle at 12% 18%, #ffffff66 0 60px, transparent 61px),radial-gradient(circle at 82% 8%, #ffffff55 0 80px, transparent 81px);}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit}
.svgdisp{font-family:var(--f-display)}
.svgbody{font-family:var(--f-body)}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em;
  padding:.55em 1.1em;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--card)} .btn.go{background:var(--teal);color:#fff} .btn.warn{background:var(--coral);color:#fff} .btn.plum{background:var(--plum);color:#fff}
.btn.sm{font-size:.85rem;padding:.38em .75em;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.btn.sm:active{box-shadow:0 0 0 var(--ink)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lcd{font-family:var(--f-lcd);background:var(--lcd-bg);color:var(--lcd-fg);border:2px solid var(--ink);border-radius:8px;padding:0 .4em;line-height:1.15;
  font-variant-numeric:tabular-nums;letter-spacing:.03em;text-shadow:0 0 6px #a6ff8f55}
.num{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:.35em .8em;font-weight:600;font-size:.85rem;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:.3em;font-size:.74rem;font-weight:600;padding:.12em .55em;border-radius:999px;border:1.5px solid var(--ink);background:var(--wash);white-space:nowrap}
.chip.time{background:var(--time-bg)} .chip.cost{background:var(--cost-bg)} .chip.good{background:var(--good-bg);color:#14552d} .chip.bad{background:var(--bad-bg);color:#8a1f17} .chip.note{background:var(--wash)}
.screen{min-height:100%}
[hidden]{display:none!important}

/* ---------- title ---------- */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 14px 18px;background:radial-gradient(ellipse at 50% 0,#4a3470 0,#2a1f3d 70%);overflow-y:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.title-hero{width:100%;display:flex;justify-content:center}
.title-hero img{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100dvh - 190px);border-radius:18px;border:3px solid var(--plum);box-shadow:0 10px 0 #00000040,0 18px 40px #0006}
.title-panel{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:760px;width:100%}
.title-panel p{margin:0;color:#e9e0f7;font-size:.95rem}
.title-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.title-actions .btn{font-size:1.15rem;min-width:150px}
.save-note{font-size:.85rem;color:#d7c9f0}
.foot{font-size:.75rem;color:#b9a8d8}
@media (max-width:640px){.title-actions .btn{flex:1 1 calc(50% - 12px);min-width:0}.title-hero img{max-height:none}}

/* ---------- support ---------- */
.support{border-top:2px dashed var(--line,#0002);padding-top:12px}
.support h3{margin:0 0 8px;font-family:var(--f-display);font-size:1.05rem;color:var(--plum)}
.support-body{display:flex;gap:14px;align-items:center}
.support a.btn{text-decoration:none}
.support-body p{margin:0 0 10px;font-size:.88rem;color:var(--ink-2)}
.support-qr{flex:none;display:block;line-height:0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.support-qr img{width:134px;height:134px;display:block}
@media (max-width:420px){.support-body{flex-direction:column;text-align:center}}

/* ---------- setup ---------- */
#setup{padding-block:22px 40px;padding-inline:16px;background:linear-gradient(#bfe7fbd9,#bfe7fbe6),url(assets/scr/bg_setup.webp) center/cover fixed}
.setup-wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.setup-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setup-head h1{font-size:clamp(1.6rem,4vw,2.3rem)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start}
.slot{padding:0 0 14px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.slot > :not(.stage){margin-inline:14px}
.slot.off{opacity:.75;box-shadow:3px 3px 0 var(--ink)}
.stage{position:relative;height:250px;display:flex;align-items:flex-end;justify-content:center;border-bottom:3px solid var(--ink);
  background:radial-gradient(ellipse 30% 6% at 50% 95%,#2a1f3d40,transparent),linear-gradient(180deg,color-mix(in srgb,var(--pc) 30%,#fff),color-mix(in srgb,var(--pc) 60%,#fff))}
.stage .figure{height:172px;width:auto;margin-bottom:8px;filter:drop-shadow(3px 3px 0 #2a1f3d33);transition:transform .2s ease}
.slot:hover .stage .figure{transform:translateY(-3px)}
.slot.off .stage .figure{filter:grayscale(1) brightness(1.15);opacity:.35}
.stage-tag{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.stage-tag .eyebrow{background:#fffdf8;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;color:var(--ink)}
.stage-tag b{font-family:var(--f-display);font-weight:400;font-size:1.25rem;color:var(--ink);background:#fffdf8cc;border-radius:8px;padding:0 6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.kind{align-self:flex-start}
.fieldlabel{font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:-4px}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{position:relative;width:52px;height:52px;padding:0;border-radius:50%;border:3px solid var(--ink);background:#fff;cursor:pointer;overflow:hidden}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--pc)}
.pick-seat{position:absolute;right:-2px;bottom:-2px;min-width:20px;height:20px;border-radius:999px;background:var(--ink);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.slot label{font-size:.78rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.slot input[type=text],.slot select,#setup select{font:inherit;font-size:.92rem;padding:.4em .55em;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.slot .desc{font-size:.8rem;color:var(--ink-2);min-height:2.4em}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.goals-card{padding:18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.goals-card{grid-template-columns:1fr}}
.goal-sliders{display:flex;flex-direction:column;gap:12px}
.gs{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;align-items:center;gap:10px}
.gs b{font-weight:600}
.gs output{font-family:var(--f-lcd);font-size:1.35rem;text-align:right;font-variant-numeric:tabular-nums}
.gs input[type=range]{width:100%;accent-color:var(--plum)}
.opt-col{display:flex;flex-direction:column;gap:14px}
.opt-row{display:flex;flex-direction:column;gap:6px}
.opt-row>span{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--plum)}
.setup-go{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}

/* ---------- game ---------- */
#game{display:flex;flex-direction:column;min-height:100%}
.hud{display:flex;align-items:center;gap:10px 14px;padding:10px 16px;background:var(--ink);color:#fff;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hud .brand{font-family:var(--f-display);font-size:1.1rem;color:var(--sun);white-space:nowrap}
.hud .wk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem}
.hud .wk .lcd{font-size:1.25rem}
.econ{font-size:.78rem;padding:.15em .6em;border-radius:999px;background:#ffffff1f;white-space:nowrap}
.pchips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.pchip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:#ffffff14;border:2px solid transparent;cursor:pointer;color:#fff}
.pchip.cur{border-color:var(--sun);background:#ffffff26}
.pchip .ring{--p:0;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--pc) calc(var(--p)*1%), #ffffff33 0);display:grid;place-items:center}
.pchip .ring span{width:22px;height:22px;border-radius:50%;background:var(--ink);font-size:.62rem;display:grid;place-items:center;font-weight:700}
.pchip .nm{font-size:.82rem;font-weight:600;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.hud-btns{display:flex;gap:8px}
.hud-btns .btn{background:#ffffff;}
.board{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;padding-block:16px 28px;padding-inline:16px;align-items:start}
@media (max-width:1020px){.board{grid-template-columns:minmax(0,1fr)}}
.mapwrap{position:relative;border:4px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:var(--grass)}
#map{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.bld.live{cursor:pointer}
.bld.live .art{transition:transform .15s ease}
.bld.live:hover .art,.bld.live:focus-visible .art{transform:translateY(-5px)}
.bld:focus{outline:none}
.bld.live:focus-visible .art{filter:drop-shadow(0 0 6px #7b4fd1)}
.walking .bob{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.4s}.steam path:nth-child(3){animation-delay:.8s}
@keyframes steam{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2px)}}
.bulb{animation:blink 1.2s steps(2) infinite}.bulb.b2{animation-delay:.6s}
@keyframes blink{50%{fill:#ffc93c}}
.tok.me .ring-me{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.35}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:.35em .7em;font-weight:600;font-size:clamp(.7rem,1.4vw,.92rem);
  box-shadow:3px 3px 0 var(--ink);white-space:nowrap;pointer-events:none;z-index:5;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:14px;height:14px;background:var(--card);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.cpubar{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:3px solid var(--ink);border-radius:14px;
  padding:6px 8px 6px 10px;box-shadow:3px 3px 0 var(--ink);z-index:6;font-weight:600;font-size:.9rem}
.cpubar .l{display:flex;align-items:center;gap:8px;min-width:0}
.cpubar .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.maptip{position:fixed;z-index:60;pointer-events:none;background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;box-shadow:3px 3px 0 var(--ink);max-width:260px;font-size:.85rem}
.maptip b{font-family:var(--f-display);font-weight:400;font-size:1rem;display:block}
.maptip .t{color:var(--ink-2)}
.maptip .tt{margin-top:4px;font-weight:700}
.headline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:8px 14px;background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);font-weight:600}
.headline b{font-family:var(--f-display);font-weight:400;color:var(--ink);background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:.85rem;white-space:nowrap}
.legend-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px;font-size:.82rem;color:var(--ink-2)}

/* sidebar */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.pcard{padding:14px;display:flex;flex-direction:column;gap:12px;border-color:var(--ink);background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 16%,#fff) 0 64px,#fff 64px)}
.pc-top{display:flex;align-items:center;gap:10px}
.pc-top .nm{font-family:var(--f-display);font-size:1.35rem;line-height:1.1}
.pc-top .sub{font-size:.8rem;color:var(--ink-2)}
.clockrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.clockrow .lcd{font-size:2rem;min-width:3.4ch;text-align:center}
.hbar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--wash);overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));transition:width .3s ease}
.clockrow small{grid-column:2;font-size:.75rem;color:var(--muted);margin-top:-6px}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money div{display:flex;flex-direction:column;gap:2px;min-width:0}
.money span{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.money b{font-family:var(--f-lcd);font-size:1.45rem;font-weight:400;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.sbox{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sbox h3{font-size:1.05rem}
.grow{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.85rem}
.grow .lbl{font-weight:600}
.grow .val{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink-2);text-align:right;white-space:nowrap}
.gbar{position:relative;height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--wash);overflow:hidden}
.gbar i{position:absolute;inset:0 auto 0 0;background:var(--gc);transition:width .35s ease}
.grow.met .lbl::after{content:" ✓";color:var(--good)}
.vrow{display:grid;grid-template-columns:104px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:.85rem}
.vrow b{font-weight:600}
.vrow output{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.life{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:.85rem}
.life dt{font-weight:700;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.life dd{margin:0;min-width:0}
.life .warn{color:var(--bad);font-weight:600}
.hint{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:3px dashed var(--ink);border-radius:14px;background:#fff8dc;font-size:.86rem}
.hint .q{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display)}
.endrow{display:flex;gap:10px}
.endrow .btn{flex:1}
.logbox{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.82rem;max-height:220px;overflow:auto}
.loglist li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;align-items:start}
.loglist li i{width:10px;height:10px;border-radius:50%;margin-top:5px;border:1.5px solid var(--ink)}
.loglist li.wk{display:block;font-weight:700;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(42,31,61,.55)}
.modal-card{width:min(820px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column}
.modal-card.narrow{width:min(560px,100%)}
@media (max-width:640px){.modal{align-items:flex-end;padding:0}.modal-card{border-radius:22px 22px 0 0;max-height:92dvh;box-shadow:none;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.mhead{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:3px solid var(--ink);background:var(--card);position:sticky;top:0;z-index:2}
.mhead .thumb{width:84px;height:auto;flex:none}
.mhead .ttl{flex:1;min-width:0}
.mhead h2{font-size:1.45rem;line-height:1.1}
.mhead p{margin:2px 0 0;color:var(--ink-2);font-size:.86rem}
.mhead .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mbody{padding:16px;display:flex;flex-direction:column;gap:18px}
.status{display:flex;flex-wrap:wrap;gap:8px}
.status .chip{font-size:.78rem;padding:.25em .7em}
.grp h3{font-size:1.05rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:10px 12px;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);
  box-shadow:0 3px 0 var(--ink);cursor:pointer;min-width:0;transition:transform .08s ease,box-shadow .08s ease}
.act:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 var(--ink);background:#fffbea}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.act:disabled{cursor:not-allowed;background:var(--wash);box-shadow:none;border-style:dashed}
.act:disabled .act-t{color:var(--muted)}
.act-t{font-weight:700;font-size:.95rem}
.act-d{font-size:.8rem;color:var(--ink-2)}
.act .chips{display:flex;gap:5px;flex-wrap:wrap}
.act .why{font-size:.76rem;font-weight:600;color:var(--bad)}
.act.current{border-color:var(--teal);background:#e6f8f5}
.jobfilter{margin-left:auto;font-size:.8rem;font-weight:600;display:flex;gap:6px;align-items:center;font-family:var(--f-body)}
.bankrow{display:flex;flex-wrap:wrap;gap:8px}
